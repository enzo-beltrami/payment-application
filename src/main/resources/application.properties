spring.application.name=payment-application

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Encryption
# DEV-ONLY default. Override APP_ENCRYPTION_KEY in any real environment.
# 32-byte AES key, Base64-encoded.
app.encryption.key=${APP_ENCRYPTION_KEY}

# Webhook dispatcher
app.webhooks.dispatcher.poll-interval-ms=2000
app.webhooks.dispatcher.batch-size=50
app.webhooks.dispatcher.max-attempts=8
app.webhooks.dispatcher.backoff-cap-seconds=3600
app.webhooks.dispatcher.connect-timeout-ms=5000
app.webhooks.dispatcher.read-timeout-ms=10000

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
